name: Run Python

on:
  # 定期実行 (UTC 基準)。以下は毎日 00:00 JST (= 15:00 UTC) の例
  schedule:
    - cron: "0 15 * * *"
  # GitHub の Actions タブから手動実行できるようにする
  workflow_dispatch:
  # main ブランチへ push したときも実行する(不要なら削除)
  push:
    branches: [main]

# 実行結果をリポジトリにコミットするための権限
permissions:
  contents: write

# 同時実行を防ぐ(前の実行が終わる前に次が始まらないようにする)
concurrency:
  group: run-python
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: スクリプトを実行
        run: python main.py
        env:
          # GitHub の Settings > Secrets and variables > Actions で登録した
          # シークレットをここで環境変数として渡せます
          # MY_API_KEY: ${{ secrets.MY_API_KEY }}
          TZ: Asia/Tokyo

      - name: 実行結果をコミット (output/ に変更があった場合のみ)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: 実行結果を更新 [skip ci]"
            git push
          fi
