name: Run Python

on:
  # ▼▼▼ 定期実行は現在【停止中】です ▼▼▼
  #
  # 再開したいときは、下の 2 行の先頭の「# 」を外すだけで有効になります。
  # (この on: の下に schedule: と cron: が並ぶ形にしてください)
  #
  # 定期実行 (UTC 基準)。毎日 00:37 JST (= 15:37 UTC)。
  # 「毎時 00 分」は世界中のジョブが集中して待ち時間が長くなるため、
  # あえて中途半端な分 (37 分) にずらしています。
  #
  # schedule:
  #   - cron: "37 15 * * *"
  #
  # ▲▲▲ ここまでが定期実行の設定 ▲▲▲

  # 手動実行は有効です。
  # Actions タブ → 左の "Run Python" → "Run workflow" ボタンで実行できます。
  workflow_dispatch:

# 実行結果をリポジトリにコミットするための権限
permissions:
  contents: write

# 同時実行を防ぐ(前の実行が終わる前に次が始まらないようにする)
concurrency:
  group: run-python
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージをインストール
        # 一時的なネットワークエラーに備えて 3 回まで再試行する
        run: |
          for i in 1 2 3; do
            python -m pip install --upgrade pip && pip install -r requirements.txt && exit 0
            echo "インストールに失敗しました。$((i * 10)) 秒後に再試行します ($i/3)"
            sleep $((i * 10))
          done
          echo "3 回試しましたが依存パッケージのインストールに失敗しました"
          exit 1

      - name: スクリプトを実行
        run: python main.py
        env:
          # GitHub の Settings > Secrets and variables > Actions で登録した
          # シークレットをここで環境変数として渡せます
          # MY_API_KEY: ${{ secrets.MY_API_KEY }}
          TZ: Asia/Tokyo

      - name: 実行結果をコミット (output/ に変更があった場合のみ)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: 実行結果を更新 [skip ci]"
            git push
          fi
