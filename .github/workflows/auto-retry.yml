name: Auto Retry

# 「Run Python」が失敗したときに、失敗したジョブだけを自動で再実行します。
#
# GitHub 側の一時的な障害
#   - Internal server error
#   - The job was not acquired by Runner of type hosted even after multiple attempts
# はコードの問題ではなく、時間をおいて再実行すればほぼ成功します。
# それを人手ではなく自動でやるためのワークフローです。

on:
  workflow_run:
    workflows: ["Run Python"]
    types: [completed]

# 失敗したジョブを再実行するために必要な権限
permissions:
  actions: write

jobs:
  retry:
    # 失敗したときだけ動かす。
    # run_attempt で再試行回数を制限し、無限ループを防ぐ(最大 3 回まで実行)。
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: 少し待つ (GitHub 側の障害が復旧するのを待つ)
        run: sleep 120

      - name: 失敗したジョブを再実行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "実行 #${{ github.event.workflow_run.run_number }} が失敗しました (試行 ${ATTEMPT} 回目)。再実行します。"
          gh api --method POST \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/rerun-failed-jobs"
